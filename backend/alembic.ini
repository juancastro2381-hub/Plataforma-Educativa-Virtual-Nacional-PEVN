# ============================================================
# Alembic configuration for PEVN Backend
# ============================================================
# Run migrations from the backend/ directory:
#   alembic upgrade head
#   alembic revision --autogenerate -m "description"
# ============================================================

[alembic]
# Location of the migrations directory (relative to this file)
script_location = migrations

# Add backend/ to sys.path so app.* imports work in env.py
prepend_sys_path = .

# Template used for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration file timestamps
timezone = UTC

# NOTE: sqlalchemy.url is intentionally NOT set here.
# It is loaded at runtime from the application settings (environment variable DATABASE_URL).
# See migrations/env.py for the dynamic URL injection.
# sqlalchemy.url = postgresql+asyncpg://...

# ------------------------------------------------------------
# Logging — controls Alembic's own log output
# ------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
