# ============================================================
# PEVN — Docker Compose Development Environment
# ============================================================
# This file defines the LOCAL DEVELOPMENT environment.
# For staging/production deployment, use separate configuration
# files that do not expose internal ports and use production images.
#
# Usage:
#   1. cp .env.example .env
#   2. Edit .env with real values (see .env.example for guidance)
#   3. docker compose up -d
#   4. docker compose logs -f
#
# Services:
#   db        — PostgreSQL 16 (port 5432)
#   redis     — Redis 7 (port 6379)
#   backend   — FastAPI (port 8000)
#   frontend  — Vite dev server (port 3000)
#
# Security note: Internal ports (5432, 6379) are exposed here for
# local development tooling. In production, these must NOT be
# exposed to the public network.
# ============================================================

services:

  # ------------------------------------------------------------------
  # PostgreSQL 16
  # ------------------------------------------------------------------
  db:
    image: postgres:16.4-alpine
    container_name: pevn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      # PostgreSQL tuning for development
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      # Persist database data across container restarts
      - postgres_data:/var/lib/postgresql/data
      # Run initialization scripts on first start
      - ./infrastructure/docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      # Expose for local development tools (pgAdmin, psql, etc.)
      # Remove this in production
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pevn-network

  # ------------------------------------------------------------------
  # Redis 7
  # ------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: pevn-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      # Expose for local development tools
      # Remove this in production
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pevn-network

  # ------------------------------------------------------------------
  # PEVN Backend — FastAPI
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: final
    container_name: pevn-backend
    restart: unless-stopped
    environment:
      # Application
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      # Database — use app user (not admin)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Security
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # API
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      # Hot reload in development — mount source code
      - ./backend:/app
      # Exclude the virtual environment from the host mount
      - /app/.venv
    # Override CMD for development hot reload
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
      --no-access-log
    networks:
      - pevn-network

  # ------------------------------------------------------------------
  # PEVN Frontend — Vite Development Server
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pevn-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-0.1.0}
      VITE_APP_NAME: Plataforma Educativa Virtual Nacional
      VITE_APP_ENV: ${ENVIRONMENT:-development}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      # Hot reload in development
      - ./frontend:/app
      # Keep container node_modules (not overridden by host mount)
      - /app/node_modules
    networks:
      - pevn-network

# ------------------------------------------------------------------
# Volumes
# ------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------
networks:
  pevn-network:
    driver: bridge
    name: pevn-network
